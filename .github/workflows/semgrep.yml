# Projektregeln aus .semgrep/rules.yml. Funde erscheinen im Code Scanning und machen den Lauf rot.
name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan with project rules
        run: semgrep scan --config .semgrep --metrics=off --error --sarif --output semgrep.sarif src

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
