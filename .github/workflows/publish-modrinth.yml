# Veröffentlicht eine bereits getaggte Version nachträglich nur auf Modrinth

name: Publish to Modrinth

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (z. B. v0.5.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build

      - name: Determine Version
        id: get_version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VER="${TAG#v}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: '6Gr0fyD8'
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          version: ${{ steps.get_version.outputs.version }}
          name: 'mc-3ver-${{ steps.get_version.outputs.version }}.jar'
          version-type: release
          changelog-file: CHANGELOG_EN.md
          files: |
            build/libs/!(*-sources).jar
            build/libs/*-sources.jar
          loaders: fabric
          game-versions: ${{ steps.get_version.outputs.mc }}
          java: Java 25
          dependencies: fabric-api:required
