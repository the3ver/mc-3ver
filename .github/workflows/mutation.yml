# Wöchentliches Mutation Testing der *Logic-Klassen. Zu lang für jeden Push, aber zeigt, ob Tests echtes Verhalten absichern.
name: Mutation Testing

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  pitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run PIT
        run: |
          chmod +x gradlew
          mkdir -p .gradle/agent-check
          bash scripts/mutation-report.sh --run 40 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: build/reports/pitest/
