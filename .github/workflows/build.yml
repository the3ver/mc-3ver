# Automatically build the project and run tests for every push and pull request.
name: Build Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build

      # Generierte Daten müssen zum Provider-Code passen: wer einen Provider ändert, committet auch die Ausgabe
      - name: Check generated data is up to date
        run: |
          ./gradlew runDatagen
          git status --porcelain -- src/main/generated
          test -z "$(git status --porcelain -- src/main/generated)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mc-3ver-build
          path: build/libs/
