name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
            echo "version=$VER" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "version=0.4.2" >> $GITHUB_OUTPUT
            echo "tag=v0.4.2" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Mod Platforms (Modrinth & CurseForge)
        uses: Kira-NT/mc-publish@v3.3
        continue-on-error: true
        with:
          modrinth-id: '6Gr0fyD8'
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: '1673253'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ steps.get_version.outputs.version }}
          name: 'mc-3ver-${{ steps.get_version.outputs.version }}.jar'
          version-type: release
          changelog-file: CHANGELOG_EN.md
          files: |
            build/libs/!(*-sources).jar
            build/libs/*-sources.jar
          loaders: fabric
          game-versions: 26.2
          java: Java 25
          dependencies: fabric-api:required

