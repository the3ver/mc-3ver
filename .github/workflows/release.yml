name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod
        run: ./gradlew build

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
            echo "version=$VER" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            VER="$(grep '^version=' gradle.properties | cut -d= -f2)"
            echo "version=$VER" >> $GITHUB_OUTPUT
            echo "tag=v$VER" >> $GITHUB_OUTPUT
          fi
          echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to Mod Platforms (Modrinth & CurseForge)
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          modrinth-id: '6Gr0fyD8'
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: '1673253'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ steps.get_version.outputs.version }}
          name: 'mc-3ver-${{ steps.get_version.outputs.version }}.jar'
          version-type: release
          changelog-file: CHANGELOG_EN.md
          files: |
            build/libs/!(*-sources).jar
            build/libs/*-sources.jar
          loaders: fabric
          game-versions: ${{ steps.get_version.outputs.mc }}
          java: Java 25
          # TerraBlender heißt auf CurseForge als Fabric-Projekt terrablender-fabric
          dependencies: |
            fabric-api:required
            terrablender(required){curseforge:terrablender-fabric}

