# git-cliff: Rohentwurf der Changelog-Einträge aus Conventional Commits seit dem letzten Tag.
# Die Einträge in CHANGELOG.md/CHANGELOG_EN.md schreibt danach ein Mensch oder Agent als Text für Spieler.
# Aufruf: uvx git-cliff --unreleased   (oder über scripts/bump-version.sh)

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits -%}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ Neu hinzugefügt" },
  { message = "^fix", group = "<!-- 1 -->🐛 Fehlerbehebungen" },
  { message = "^perf", group = "<!-- 2 -->🔧 Intern" },
  { message = "^refactor", group = "<!-- 2 -->🔧 Intern" },
  { message = "^build", group = "<!-- 2 -->🔧 Intern" },
  { message = '^chore\(release\)', skip = true },
  { message = "^(docs|style|test|ci|chore)", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
